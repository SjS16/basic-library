# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Production runs on Postgres (Neon). All four databases read their
# connection from environment variables set on Render. The cache, queue
# and cable databases fall back to DATABASE_URL (one shared database)
# unless their own URL is set, so only DATABASE_URL is required.
production:
  primary:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    adapter: postgresql
    url: <%= ENV.fetch("DATABASE_CACHE_URL") { ENV["DATABASE_URL"] } %>
    migrations_paths: db/cache_migrate
  queue:
    adapter: postgresql
    url: <%= ENV.fetch("DATABASE_QUEUE_URL") { ENV["DATABASE_URL"] } %>
    migrations_paths: db/queue_migrate
  cable:
    adapter: postgresql
    url: <%= ENV.fetch("DATABASE_CABLE_URL") { ENV["DATABASE_URL"] } %>
    migrations_paths: db/cable_migrate
